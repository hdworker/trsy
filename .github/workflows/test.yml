name: test

on:
  push:
    branches: '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: check-go-version
        run: go version
      - name: go-test
        run: make test
      - name: go-test-race
        run: make test-race
      - name: upload-coverage
        if: success()
        run: make test-coverage
